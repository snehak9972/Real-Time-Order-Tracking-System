x-app: &app
  build: .
  depends_on: [kafka, postgres]
  restart: on-failure
  environment: &env
    KAFKA_BROKERS: kafka:9092
    DATABASE_URL: postgres://orders:orders@postgres:5432/orders
    KITCHEN_IDS: kitchen-1,kitchen-2

services:
  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  order-service:
    <<: *app
    command: node src/order-service.js
    ports: ["3001:3001"]
    environment: { <<: *env, SERVICE_NAME: order-service, PORT: 3001 }

  kitchen-1:
    <<: *app
    command: node src/kitchen-service.js
    environment: { <<: *env, SERVICE_NAME: kitchen-1, KITCHEN_ID: kitchen-1 }

  kitchen-2:
    <<: *app
    command: node src/kitchen-service.js
    environment: { <<: *env, SERVICE_NAME: kitchen-2, KITCHEN_ID: kitchen-2 }

  tracking-service:
    <<: *app
    command: node src/tracking-service.js
    ports: ["3002:3002"]
    environment: { <<: *env, SERVICE_NAME: tracking-service, PORT: 3002 }
